[package]
name = "ocularium"
version = "0.1.0"
edition = "2021"
description = "Local-first desktop discovery for network cameras"
repository = "https://github.com/sguzman/ocularium"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
if-addrs = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md5 = "0.7"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
des = "0.8"
hmac = "0.12"
sha1 = "0.10"
zeroize = "1.8"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "=2.12.1", default-features = false }

[profile.release]
lto = "thin"
